# ============================================
#  TimeSMP configuration
# ============================================

# How much time (in hours) a kill steals from the victim and gives to the killer.
# This is a STEAL, not two separate effects - the victim only loses exactly what the
# killer gains, and it's capped by min-time-hours below (see there for details).
kill-reward-hours: 2

# The hard floor nobody's time can go below via kills or /withdraw (admin commands
# via /timesmp settime|addtime|removetime deliberately IGNORE this floor).
# e.g. -4 means a player at -3h who gets killed only has 1h left to lose, so the
# killer only gets 1h out of that kill instead of the full kill-reward-hours.
min-time-hours: -4

# Everyone starts with this many banked seconds when first seen (0 = starts at 00:00:00).
starting-time-seconds: 0

# Heart (max health) tiers based on live leaderboard rank.
# 1 heart = 2 HP. These are the *defaults described in the spec* - change freely.
hearts:
  rank-1: 20
  rank-2-to-5: 19
  # ranks 6-40 are interpolated evenly between the two values below based on position
  rank-6: 19
  rank-40: 11
  everyone-else: 10
  # Anyone with a NEGATIVE time balance is forced to this many hearts, no matter their rank,
  # until their balance goes positive again.
  negative-balance-hearts: 8
  # Highest rank counted for the bonus-heart tiers.
  top-rank-cutoff: 40

# When a player's max health increases, should their current health be topped up to match?
heal-on-increase: true

# Quests: reward is scaled between min-reward-hours and max-reward-hours depending on
# how hard the randomly rolled target was within its range.
quests:
  min-reward-hours: 5
  max-reward-hours: 8
  # Hours to wait after completing a quest before the next one becomes available.
  cooldown-hours: 12
  kill-count:
    min: 3
    max: 8
  daily-playtime-hours:
    min: 1
    max: 3
    # A daily-playtime quest expires and rerolls if not finished within this window.
    deadline-hours: 24
  no-death-streak-hours:
    min: 1
    max: 3
  damage-dealt-hearts:
    min: 20
    max: 40

# Personal sidebar scoreboard, showing rank/time/quest progress.
scoreboard:
  enabled-by-default: true
  title: "&b&lTimeSMP"

# Extra inventory perk for the top of the leaderboard. Rank 1 gets the most slots,
# rank top-rank-cutoff gets the fewest, everyone outside the cutoff gets none at all.
# Slot counts are interpolated evenly between rank 1 and the cutoff rank.
# NOTE: the GUI is internally a 27-slot (3-row) chest - any slots beyond a player's
# current allowance just show as locked placeholders, they aren't hidden.
extra-inventory:
  top-rank-cutoff: 20
  rank-1-slots: 27
  cutoff-rank-slots: 5
  # Command used to open it: /extrainventory (aliases: extrainv, einv, inv, inventory)

# The book every player is given on join (only if they don't already have one in
# their inventory - identified by a hidden tag, not just by name/lore).
# NOTE: don't put "Page X of Y" in these - Minecraft's book UI already shows that
# in the top corner automatically, so it was showing up twice before.
guide-book:
  title: "The Clanker Plugin!"
  author: "Server"
  pages:
    - "THE CLANKER PLUGIN!\n\nHow it works:\n\nAs you play your timer goes up\n\nyou are ranked in a leaderboard of who has the longest timer!\n\nBeing in the top 40 comes with special perks!"
    - "When you eliminate another player you will steal 2 hours of their time!\n\nWhen a player enters negetive time they will be on permenent 8 hearts until they are back in positives.\n\nQUESTS->"
    - "QUESTS\n\nOnce you complete a quest you will be asigned another new quest after a shor period of time.\n\nCompleting quests earns rewards such as +6 hours.\n\nYou check your quest status with /quest!"

# How often (in seconds) the leaderboard/rank is recalculated and hearts/tab/scoreboard refreshed.
rank-refresh-seconds: 5

# By default, if a "TAB" plugin is installed, TimeSMP steps back and lets TAB own the tab-list name/
# order and nametags (see the %timesmp_...% PlaceholderAPI placeholders for wiring rank into TAB's
# own config instead). If you'd rather just disable TAB's own tab-list/nametag formatting and have
# TimeSMP set them directly itself, set this to true - it forces TimeSMP's own handling ON even
# though TAB is present.
force-own-tab-and-nametags: false

# Autosave interval for player data, in minutes.
autosave-minutes: 5

# Cosmetic tombstone that drops from above and lands at a death's location.
# Purely visual (Display entities) - has no effect on real item drops.
death-animation:
  enabled: true
  duration-seconds: 60

# Worlds listed here (exact world/folder name) are fully exempt from TimeSMP:
# no timer ticking, no kill/death time stealing, no quest tracking, and everyone
# is forced to a flat 10 hearts (default max health) while standing in them.
# Useful for a minigame/lobby world on a Multiverse setup that shouldn't touch
# the SMP time economy at all.
disabled-worlds: []

# Anti-AFK: kicks a player if they haven't physically LEFT- or RIGHT-CLICKED
# (mouse buttons, not held keys) within the timeout. Deliberately click-only -
# movement, chat, and commands do NOT reset the timer, so a simple auto-walk or
# auto-jump macro won't stop the kick. Players with the timesmp.afk.bypass
# permission are never kicked.
afk-kick:
  enabled: true
  timeout-minutes: 5
  # Sends an actionbar countdown warning starting this many seconds before the kick.
  warning-seconds: 30
