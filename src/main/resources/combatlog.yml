# ============================================
#  TimeSMP combat-log configuration
#  (kept separate from config.yml so this whole feature is easy to find/edit
#  on its own - none of these settings touch the time economy directly)
# ============================================

# How long a combat tag lasts, in seconds. Getting hit by another player refreshes
# it back up to this full amount every time (it does not stack/extend beyond it).
combat-duration-seconds: 30

# Shows a countdown above the hotbar (action bar) the whole time you're tagged.
show-actionbar: true

# While tagged, both the ender pearl AND mace get a cooldown this long (seconds),
# reapplied fresh on every hit - same as the combat tag itself. Pearls are blocked
# by BOTH vanilla's real item-cooldown system (the red swirl - genuinely unusable)
# AND an explicit cancel on the throw itself, covering the pearl whether it's in
# your main hand or your offhand either way.
# Mace cannot be gated the same way (vanilla's item-cooldown doesn't block melee
# swings), so instead any mace hit thrown WHILE ALREADY tagged is cancelled
# outright - your very first hit (which starts the tag) still lands, it's only
# hits after that, until the tag expires, that get blocked.
pearl-cooldown-seconds: 30
mace-cooldown-seconds: 30

# Blocks starting to glide with an Elytra entirely while tagged (can't combat-log
# by flying away either).
block-elytra: true

# If true, a player who disconnects while still tagged is treated as having died
# right then: their real inventory AND their TimeSMP extra-inventory (if any) drop
# on the ground where they stood, and whoever tagged them most recently still gets
# the normal kill-steal (see kill-reward-hours / min-time-hours in config.yml) -
# applied immediately on the disconnect, not deferred until they log back in.
# The time-steal part still only happens if the main timer is RUNNING (same rule
# as a normal kill) - the item-drop punishment happens regardless of that.
punish-combat-log: true

# Worlds where the ENTIRE combat-log system is off - no tagging, no cooldowns, no
# elytra block, no log-out punishment. This is a SEPARATE list from disabled-worlds
# in config.yml on purpose, so a world can have the time economy off but combat-tag
# rules still on, or vice versa, independently.
disabled-worlds: []
