name: QuickDuel
version: '1.0.0'
main: com.quickduel.plugin.QuickDuel
api-version: '1.21'
author: QuickDuel
description: /duel a player - they accept or decline (in chat or by command), and on accept both get teleported to the same random spot.
softdepend: [PlaceholderAPI]

commands:
  duel:
    description: Challenge a player to a duel, or accept/decline your most recent one
    usage: /duel <player|accept|decline>
    permission: quickduel.use

permissions:
  quickduel.use:
    description: Allows use of /duel
    default: true
